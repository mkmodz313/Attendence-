name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Accepts the secret as base64 OR as the raw JSON text. If it is missing/invalid,
      # a placeholder file is used so the build still succeeds (login will not work until
      # you add your real google-services.json secret).
      - name: Prepare google-services.json
        run: |
          set -e
          OUT=app/google-services.json
          ok=0
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
              printf '%s' "$GOOGLE_SERVICES_JSON" > "$OUT"
            else
              printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n ' | base64 -d > "$OUT" 2>/dev/null || true
            fi
            if python3 -c "import json,sys; json.load(open('$OUT'))" 2>/dev/null; then ok=1; fi
          fi
          if [ "$ok" != "1" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON secret missing or invalid. Using a placeholder so the build passes. Add the real secret before using the app."
            cat > "$OUT" <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"placeholder-project","storage_bucket":"placeholder-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000","android_client_info":{"package_name":"com.attendance.pro"}},"api_key":[{"current_key":"placeholder-key"}]}],"configuration_version":"1"}
          JSON
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build signed release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          KEYSTORE_PATH="$RUNNER_TEMP/release.jks" gradle assembleRelease --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
